name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "iPhone app: sign it for TestFlight without uploading (export), or upload it (upload)"
        type: choice
        options: [none, export, upload]
        default: none

permissions:
  contents: read

env:
  # The release Xcode that builds the iPhone app (scripts/select-xcode.sh). App Store Connect refuses builds made with a
  # beta Xcode, so it's pinned: when Apple ships a new release Xcode and the xcode-27 image has it, update this.
  RELEASE_XCODE: "27.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check the jazz data
        run: python3 -I scripts/validate-data.py

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Releases are signed with the Developer ID certificate and notarized; other builds are signed ad hoc.
      - name: Import the Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          identity="$(scripts/import-certificate.sh "Developer ID Application")"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build app (Apple Silicon + Intel)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: scripts/build-app.sh

      - name: Notarize
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_API_KEY" > "$NOTARY_KEY"
          scripts/notarize.sh
          rm -f "$NOTARY_KEY"

      - name: Remove the signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Package
        id: package
        run: |
          name="JazzDiscovery-${{ steps.version.outputs.version }}-macOS.zip"
          ditto -c -k --keepParent "build/Jazz Discovery.app" "$name"
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JazzDiscovery-macOS
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error

  ios:
    name: Build for iPhone
    # The iPhone app needs the iOS 26.1 SDK or later; it's built with the same release Xcode as the TestFlight upload.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the release Xcode
        run: scripts/select-xcode.sh

      - name: Build the iPhone app
        run: |
          xcodebuild -project JazzDiscovery.xcodeproj -scheme JazzDiscoveryMobile -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  testflight:
    name: Upload the iPhone app to TestFlight
    # Every release tag; by hand with the workflow's "testflight" input.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.testflight != 'none')
    needs: [build, ios]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the release Xcode
        run: scripts/select-xcode.sh

      # An App Manager API key can't use cloud-managed signing, so the Apple Distribution certificate comes from a
      # secret; with the key, testflight.sh makes an App Store profile for it (scripts/provisioning-profiles.swift),
      # signs manually and uploads.
      - name: Import the Apple Distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          identity="$(scripts/import-certificate.sh "Apple Distribution")"
          # The team is the identity's last part: "Apple Distribution: Name (TEAMID)".
          team="$(sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p' <<< "$identity")"
          [ -n "$team" ] || { echo "::error::No team ID in \"$identity\""; exit 1; }
          echo "DEVELOPMENT_TEAM=$team" >> "$GITHUB_ENV"

      - name: Archive and upload
        env:
          API_KEY: ${{ secrets.NOTARY_API_KEY }}
          ASC_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          UPLOAD: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.testflight == 'upload') && '1' || '0' }}
          # Optional: the app's own Last.fm API account, so people connect Last.fm with one tap (iOS/Signing.xcconfig).
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          export ASC_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY" > "$ASC_KEY"
          # Releases take their version from the tag; other runs use iOS/Version.xcconfig.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          DISTRIBUTION_CERTIFICATE=1 scripts/testflight.sh
          rm -f "$ASC_KEY"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: JazzDiscovery-macOS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What's new: this version's section of CHANGELOG.md, or Unreleased if it wasn't renamed before tagging.
          version="${GITHUB_REF_NAME#v}"
          section() { awk -v heading="## $1" '$0 == heading { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md; }
          changes="$(section "$version")"
          [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ] || changes="$(section Unreleased)"
          {
            if [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then
              printf '### What'"'"'s new\n%s\n\n' "$changes"
            fi
            cat <<'NOTES'
          ### Install

          Download `JazzDiscovery-*-macOS.zip` below, unzip it and move **Jazz Discovery.app** to Applications (Apple Silicon and Intel, macOS 15+). It's signed and notarized by Apple.

          Full tracks play through your Apple Music subscription (click **Apple Music** at the bottom of the sidebar to connect); without one you get 30-second previews. See the [README](https://github.com/davidlago/jazz-discovery#readme) for details.
          NOTES
          } > notes.md
          gh release create "$GITHUB_REF_NAME" JazzDiscovery-*-macOS.zip JazzDiscovery-*-macOS.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Jazz Discovery ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
